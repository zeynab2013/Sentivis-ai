[app]
name = "Sentivis AI"
version = "1.0.0"

[logging]
level = "INFO"
console_enabled = true
max_file_bytes = 5242880
backup_count = 5

[image]
max_dimension = 4096
max_file_size_bytes = 33554432
yolo_inference_size = 640

[hardware]
vram_warning_ratio = 0.85
ram_warning_ratio = 0.90
cpu_fallback_enabled = true
pipeline_timeout_seconds = 600

[paths]
cache_dir = "cache"
exports_dir = "exports"
logs_dir = "logs"
models_dir = "models"
model_search_paths = []

[workers]
export_thread_pool_size = 2

[competition]
quality_threshold = 0.55
max_hallucination_risk = 0.25
deterministic_seed = 42
gemma_temperature = 0.0
vram_release_threshold_mb = 64.0
